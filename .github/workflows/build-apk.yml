name: Build EduQuest AR Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

jobs:
  build-android-apk:
    name: Build Android APK for Hisense IFP
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit
          else
            npm install --no-audit
          fi

      - name: 6. Build Web Assets (Vite)
        run: |
          npm run build

      - name: 7. Sync Capacitor with Android Platform
        run: |
          npx cap sync android

      - name: 8. Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 9. Build Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 10. Verify APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk || exit 1

      - name: 11. Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduQuest-AR-Hisense-IFP-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
